
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Downloading Options Plotter...</title>
</head>
<body>
  <p id="status">Starting your Options Plotter download...</p>

  <p>
    <a id="downloadLink" href="#">
      Click here if your download does not start.
    </a>
  </p>

  <script>
    (function () {
      const downloads = {
        basic:
          'https://github.com/MarkB2026/TraderRepository-Downloads/releases/download/optionsplotter-basic-v1.0.0/OptionsPlotter_Basic_Beta_v1.0.0.9.exe',

        premium:
          'https://github.com/MarkB2026/TraderRepository-Downloads/releases/download/optionsplotter-premium-v1.0.0/OptionsPlotter_Premium_Beta_v1.0.0.3.exe',

        platinum:
          'https://github.com/MarkB2026/TraderRepository-Downloads/releases/download/optionsplotter-platinum-v1.0.0/OptionsPlotter_Platinum_Beta_v1.0.0.exe'
      };

      const requested = (
        new URLSearchParams(window.location.search)
          .get('edition') || 'basic'
      ).toLowerCase();

      const edition = Object.prototype.hasOwnProperty.call(
        downloads, requested
      ) ? requested : 'basic';

      const label =
        edition.charAt(0).toUpperCase() + edition.slice(1);

      const target = downloads[edition];

      document.title = 'Downloading Options Plotter ' + label + '...';

      document.getElementById('status').textContent =
        'Starting your Options Plotter ' + label + ' download...';

      document.getElementById('downloadLink').href = target;

      window.location.replace(target);
    })();
  </script>
</body>
</html>
