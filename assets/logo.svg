<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 255" role="img" aria-labelledby="title desc">
<title id="title">Options Plotter</title><desc id="desc">Silver magnifying glass with three blue candles and a rising arrow, beside stacked silver OPTIONS and electric blue PLOTTER lettering.</desc>
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fff"/><stop offset=".26" stop-color="#b9d0e4"/><stop offset=".48" stop-color="#f6fbff"/><stop offset=".73" stop-color="#6888a4"/><stop offset="1" stop-color="#e7f4ff"/></linearGradient>
 <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".44" stop-color="#edf5ff"/><stop offset=".55" stop-color="#a3bed5"/><stop offset="1" stop-color="#718fa9"/></linearGradient>
 <linearGradient id="cyanText" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#62faff"/><stop offset=".47" stop-color="#0fcfff"/><stop offset="1" stop-color="#0783f7"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123c61"/><stop offset=".55" stop-color="#05162a"/><stop offset="1" stop-color="#071326"/></linearGradient>
 <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f7ff"/><stop offset=".23" stop-color="#6f96b5"/><stop offset=".5" stop-color="#25466d"/><stop offset=".76" stop-color="#94b8d3"/><stop offset="1" stop-color="#122c50"/></linearGradient>
 <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#067bd5"/><stop offset="1" stop-color="#37edff"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- Lens and handle, intentionally visually distinct from the Wheel Tracker icon -->
<g transform="translate(0 0)">
 <path d="M66 178 L20 220 Q12 227 19 237 L28 245 Q37 251 45 244 L92 196" fill="url(#handle)" stroke="#a5c9e4" stroke-width="4"/>
 <path d="M28 231 L77 187" fill="none" stroke="#d9f7ff" stroke-opacity=".65" stroke-width="3"/>
 <circle cx="135" cy="112" r="93" fill="url(#glass)" stroke="#365d81" stroke-width="13"/>
 <circle cx="135" cy="112" r="98" fill="none" stroke="url(#metal)" stroke-width="9"/>
 <circle cx="135" cy="112" r="85" fill="none" stroke="#21aefa" stroke-width="2.5" opacity=".75"/>
 <path d="M64 74 Q92 32 148 32" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
 <!-- Three enlarged candlesticks -->
 <g fill="url(#bars)" stroke="#54eaff" stroke-width="2">
 <path d="M82 125 v-24 M82 159 v-12" fill="none" stroke-width="4"/>
 <rect x="71" y="111" width="22" height="37" rx="1"/>
 <path d="M119 91 v-21 M119 142 v-15" fill="none" stroke-width="4"/>
 <rect x="108" y="83" width="22" height="47" rx="1"/>
 <path d="M155 66 v-19 M155 111 v-15" fill="none" stroke-width="4"/>
 <rect x="144" y="60" width="22" height="42" rx="1"/>
 </g>
 <path d="M66 173 L100 148 L123 158 L151 120 L177 133 L206 83" fill="none" stroke="#10dfff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".4" filter="url(#glow)"/>
 <path d="M66 173 L100 148 L123 158 L151 120 L177 133 L206 83" fill="none" stroke="#16dfff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
 <path d="M187 84 L214 70 L209 101 Z" fill="#20eaff"/>
</g>
<!-- Compact wordmark optimized for top-left site navigation -->
<g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="1.3">
 <text x="248" y="116" font-size="81" textLength="580" lengthAdjust="spacingAndGlyphs" fill="url(#silverText)" stroke="#d2e8f8" stroke-opacity=".4" stroke-width="1">OPTIONS</text>
 <text x="248" y="202" font-size="83" textLength="580" lengthAdjust="spacingAndGlyphs" fill="url(#cyanText)" stroke="#38e5ff" stroke-opacity=".35" stroke-width="1">PLOTTER</text>
</g>
</svg>
